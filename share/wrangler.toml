# Murmur's shared links (docs/COMPARTIR.md). Murmur publishes the Worker itself from
# Settings › Compartir; this file is for `./setup.sh` and `npm run dev`.
name = "murmur-share"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# The page goes inside the Worker as text modules, as when Murmur publishes it (share.rs).
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/viewer-script.js"]
fallthrough = false

[[kv_namespaces]]
binding = "SHARES"
id = "KV_NAMESPACE_ID"
