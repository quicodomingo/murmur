# Murmur's shared links (docs/COMPARTIR.md). `./setup.sh` fills in the KV namespace and the
# API key the first time; after that, `npm run deploy` publishes changes.
name = "murmur-share"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
# /viewer.html stays /viewer.html (the Worker serves it for every link), and a missing file
# falls through to the Worker.
html_handling = "none"
not_found_handling = "none"

[[kv_namespaces]]
binding = "SHARES"
id = "KV_NAMESPACE_ID"
