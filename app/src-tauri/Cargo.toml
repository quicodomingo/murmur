[package]
name = "transcriptor"
version = "0.11.4"
description = "Transcriptor de reunions en català, local"
authors = ["Quico Domingo"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "transcriptor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = { version = "1.13.8", default-features = false }
cpal = "0.16"
crossbeam-channel = "0.5"
anyhow = "1"
log = "0.4"
opus = "0.4"
sonora = "0.2"
ogg = "0.9"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-autostart = "2"
llama-cpp-2 = "0.1.160"
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "ndarray", "api-28"] }
ort-sys = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "api-28", "disable-linking"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
ureq = { version = "2", features = ["json"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
sha2 = "0.10"
semver = "1"
libc = "0.2"
getrandom = "0.3"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.160", features = ["metal"] }
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["static"] }
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDate", "NSArray", "NSString", "NSURL", "NSPredicate", "NSError", "NSValue"] }
objc2-event-kit = { version = "0.3", features = ["EKEventStore", "EKCalendar", "EKCalendarItem", "EKEvent", "EKParticipant", "EKSource", "EKTypes", "EKObject", "block2", "objc2-app-kit"] }
core-graphics = "0.24"
core-foundation = "0.10"
security-framework = "3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSColor", "NSColorSpace", "std"] }

# Off macOS: the system's secret store through keyring (Credential Manager, Secret Service).
[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
# Opening audio files (afconvert does it on macOS).
symphonia = { version = "0.5", features = ["all-codecs", "all-formats"] }

# Off macOS, sherpa-onnx as shared libraries, which build.rs hands to the installers:
# - Windows: its static libraries use the static C runtime (/MT), which can't be linked with
#   llama.cpp's (/MD).
# - Linux: its static onnxruntime and llama.cpp each bring their own copy of libstdc++'s
#   templates (std::regex), built by different compilers; the linker keeps one and onnxruntime
#   crashes creating its environment ("free(): invalid pointer"). The .so keeps its own.
# sherpa-onnx-sys is direct so that its build (which unpacks them) runs before ours.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["shared"] }
sherpa-onnx-sys = { version = "1.13.8", default-features = false, features = ["shared"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }


[dev-dependencies]
symphonia = { version = "0.5", features = ["all-codecs", "all-formats"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# All zip 2.x releases are yanked on crates.io, but sherpa-onnx-sys (build dep) still requires zip ^2.
[patch.crates-io]
zip = { git = "https://github.com/zip-rs/zip2", tag = "v2.6.1" }

# llama.cpp is built by cmake, which follows the package's opt-level: unoptimised it's far too
# slow to try the cover in `tauri dev`.
[profile.dev.package.llama-cpp-sys-2]
opt-level = 3
