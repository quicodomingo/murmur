[package]
name = "transcriptor"
version = "0.1.0"
description = "Transcriptor de reunions en català, local"
authors = ["Quico Domingo"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "transcriptor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "1.13.8"
cpal = "0.16"
crossbeam-channel = "0.5"
anyhow = "1"
log = "0.4"
opus = "0.4"
sonora = "0.2"
ogg = "0.9"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "0.3.6"
core-media-rs = "0.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# All zip 2.x releases are yanked on crates.io, but sherpa-onnx-sys (build dep) still requires zip ^2.
[patch.crates-io]
zip = { git = "https://github.com/zip-rs/zip2", tag = "v2.6.1" }
