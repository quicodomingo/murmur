[package]
name = "murmur-whisper"
version = "0.2.0"
description = "Murmur's final pass: Whisper (whisper.cpp, Metal or Vulkan) in a process of its own"
edition = "2024"

# Not part of the app's crate: whisper.cpp and llama.cpp each bring their own ggml, which can't be
# linked into one binary. Murmur runs this as a sidecar (tauri.conf.json externalBin).
[workspace]

[dependencies]
whisper-rs = "0.16"
# ggml's device list, to choose the GPU before loading (pick_gpu). The version whisper-rs uses.
whisper-rs-sys = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[features]
# Vulkan on Windows x64 and Linux (MURMUR_VULKAN=1 in scripts/build-whisper.mjs); without it, the CPU.
vulkan = ["whisper-rs/vulkan"]

# Metal on the Mac.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[profile.release]
lto = true
opt-level = 3
strip = true
