[package]
name = "murmur-whisper"
version = "0.2.0"
description = "Murmur's final pass: Whisper (whisper.cpp, Metal) in a process of its own"
edition = "2024"

# Not part of the app's crate: whisper.cpp and llama.cpp each bring their own ggml, which can't be
# linked into one binary. Murmur runs this as a sidecar (tauri.conf.json externalBin).
[workspace]

[dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = true
opt-level = 3
strip = true
