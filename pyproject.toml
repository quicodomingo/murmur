[project]
name = "meeting-transcript"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "faster-whisper>=1.2.1",
    "huggingface-hub>=2.2.0",
    "jiwer>=4.0.0",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "onnx-asr>=0.12.0",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
