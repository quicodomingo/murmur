<!doctype html>
<html lang="ca" data-theme="acid" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etiquetes</title>
<link rel="stylesheet" href="../../app/src/murmur-theme.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--mm-fill-subtle); color: var(--mm-text-primary); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  [data-mode="dark"] body { background: #000; }
  .i { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .window { margin: 24px auto; width: 1120px; height: 700px; background: var(--mm-background); border-radius: 12px; overflow: hidden; display: flex; box-shadow: 0 20px 50px rgb(0 0 0 / .18), 0 0 0 1px var(--mm-separator); position: relative; }

  /* Sidebar */
  nav { width: 240px; flex: none; background: var(--mm-sidebar); border-right: 1px solid var(--mm-separator); display: flex; flex-direction: column; }
  .head { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 18px; }
  .lights { display: flex; gap: 8px; } .lights i { width: 12px; height: 12px; border-radius: 50%; background: var(--mm-separator); }
  .brand { font-size: 12px; font-weight: 700; letter-spacing: -.02em; display: flex; align-items: center; gap: 6px; }
  .logo { width: 18px; height: 18px; border-radius: 5px; background: var(--mm-logo-background); display: flex; align-items: center; justify-content: center; gap: 2px; }
  .logo b { width: 2.5px; height: 9px; border-radius: 1px; background: var(--mm-logo-bar-1); } .logo b + b { background: var(--mm-logo-bar-2); height: 6px; }
  .new { margin: 0 12px 4px; height: 32px; border-radius: 8px; background: var(--mm-new-meeting); color: var(--mm-on-new-meeting); display: flex; align-items: center; gap: 8px; padding: 0 10px; font-weight: 600; }
  .new span { flex: 1; } .new kbd { font: 500 11px inherit; opacity: .6; }
  .opts { margin: 0 8px 8px; height: 24px; display: flex; align-items: center; gap: 4px; padding: 0 6px; font-size: 12px; color: var(--mm-text-secondary); }
  .search { margin: 0 12px; height: 28px; border-radius: 6px; background: var(--mm-search-field); display: flex; align-items: center; gap: 6px; padding: 0 8px; color: var(--mm-text-secondary); }
  .search span { flex: 1; }
  .scroll { flex: 1; overflow: hidden; padding: 12px 8px 0; }
  h3 { margin: 0; padding: 0 8px 4px; font-size: 11px; font-weight: 600; color: var(--mm-text-secondary); display: flex; align-items: center; gap: 4px; }
  h3 .more { margin-left: auto; color: var(--mm-text-tertiary); }
  .row { position: relative; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; border-radius: 6px; }
  .row .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .row small { font-size: 11px; color: var(--mm-text-secondary); font-variant-numeric: tabular-nums; }
  .row.sel { background: var(--mm-sidebar-selection); font-weight: 500; }
  .row.sel::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--mm-sidebar-selection-bar); }
  .row .tagi { color: var(--mm-text-secondary); }
  .tags { margin-bottom: 12px; }
  .tags .row { height: 26px; }
  .tags .row.sel { font-weight: 600; }
  .tags .row.sel::before { display: none; }
  .group { margin-bottom: 12px; }
  .filter { margin: 0 8px 8px; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--mm-text-secondary); }
  .foot { height: 44px; border-top: 1px solid var(--mm-separator); display: flex; align-items: center; padding: 0 8px 0 14px; font-size: 11px; color: var(--mm-text-secondary); }
  .foot span { flex: 1; }

  /* Main */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .toolbar { height: 52px; border-bottom: 1px solid var(--mm-separator); display: flex; align-items: center; gap: 8px; padding: 0 14px; }
  .seg { display: flex; background: var(--mm-segmented-track); border-radius: 7px; padding: 2px; font-size: 12px; }
  .seg b { font-weight: 400; padding: 3px 12px; border-radius: 5px; color: var(--mm-text-secondary); }
  .seg b.on { background: var(--mm-segmented-selected); color: var(--mm-text-primary); font-weight: 500; box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
  .sp { flex: 1; }
  article { max-width: 680px; margin: 0 auto; padding: 56px 40px; width: 100%; }
  h1 { margin: 0; font-size: 30px; line-height: 1.2; letter-spacing: -.015em; }
  .meta { margin-top: 6px; color: var(--mm-text-secondary); }
  .chips { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; position: relative; }
  .chip { height: 22px; display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; border-radius: 5px; background: var(--mm-fill-subtle); font-size: 12px; font-weight: 500; }
  .chip .x { opacity: 0; color: var(--mm-text-secondary); margin-right: -3px; }
  .chip.hover .x { opacity: 1; }
  .chip .auto { color: var(--mm-text-tertiary); }
  .chip.add { background: none; color: var(--mm-text-secondary); font-weight: 400; padding: 0 5px; }
  .chip.add.on { background: var(--mm-fill-subtle); color: var(--mm-text-primary); }
  .chip.sugg { background: none; box-shadow: inset 0 0 0 1px var(--mm-separator); color: var(--mm-text-secondary); font-weight: 400; }
  .chip.sugg em { font-style: normal; color: var(--mm-text-primary); font-weight: 500; }
  .utt { margin-top: 40px; display: flex; flex-direction: column; gap: 14px; font-size: 16px; line-height: 1.65; }
  .utt div { display: flex; gap: 14px; }
  .flag { flex: none; width: 92px; font-size: 12px; font-weight: 600; padding-top: 3px; }
  .utt p { margin: 0; }
  .muted { color: var(--mm-text-secondary); }

  /* Tag popover */
  .pop { position: absolute; top: 28px; left: 0; width: 264px; background: var(--mm-background); border-radius: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / .16), 0 0 0 1px var(--mm-separator); padding: 4px; font-size: 13px; z-index: 5; }
  [data-mode="dark"] .pop { background: var(--mm-field); }
  .pop .in { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-bottom: 1px solid var(--mm-separator); margin: -4px -4px 4px; color: var(--mm-text-primary); }
  .pop .in i { width: 1.5px; height: 15px; background: var(--mm-caret); margin-left: -4px; }
  .pop .lbl { padding: 4px 8px 2px; font-size: 11px; color: var(--mm-text-secondary); font-weight: 500; }
  .pop .it { height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 6px; }
  .pop .it.f { background: var(--mm-fill-subtle); }
  .pop .it .c { width: 14px; }
  .pop .it small { margin-left: auto; font-size: 11px; color: var(--mm-text-secondary); }
  .pop hr { border: 0; border-top: 1px solid var(--mm-separator); margin: 4px 0; }

  /* Tag menu in the sidebar */
  .menu { position: absolute; left: 196px; top: 200px; width: 210px; background: var(--mm-background); border-radius: 8px; box-shadow: 0 10px 30px rgb(0 0 0 / .16), 0 0 0 1px var(--mm-separator); padding: 4px; z-index: 6; }
  [data-mode="dark"] .menu { background: var(--mm-field); }
  .menu div { height: 26px; display: flex; align-items: center; padding: 0 8px; border-radius: 5px; }
  .menu .f { background: var(--mm-fill-subtle); }
  .menu .d { color: var(--mm-recording-label); }
  .menu hr { border: 0; border-top: 1px solid var(--mm-separator); margin: 4px 0; }

  .cap { width: 1120px; margin: 28px auto 0; font-size: 13px; color: var(--mm-text-secondary); }
  .cap b { color: var(--mm-text-primary); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="tag" viewBox="0 0 24 24"><path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
  <symbol id="x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
  <symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
</svg>

<template id="win">
<div class="window">
  <nav>
    <div class="head"><span class="lights"><i></i><i></i><i></i></span><span class="brand"><span class="logo"><b></b><b></b></span>murmur</span></div>
    <div class="new"><svg class="i"><use href="#plus"/></svg><span>Nova reunió</span><kbd>⌘N</kbd></div>
    <div class="opts">Català + castellà <span class="muted">·</span> <svg class="i" style="width:12px;height:12px"><use href="#user"/></svg> Només jo <svg class="i" style="width:12px;height:12px;margin-left:auto;opacity:.6"><use href="#down"/></svg></div>
    <div class="search"><svg class="i"><use href="#search"/></svg><span data-ph>Cerca</span></div>
    <div class="scroll">
      <section class="tags">
        <h3>Etiquetes <span class="more">⌄</span></h3>
        <div class="row" data-all><span class="t">Totes les reunions</span><small>24</small></div>
        <div class="row" data-acme><svg class="i tagi"><use href="#tag"/></svg><span class="t">Acme</span><small>8</small></div>
        <div class="row"><svg class="i tagi"><use href="#tag"/></svg><span class="t">Fundació Bosch</span><small>5</small></div>
        <div class="row"><svg class="i tagi"><use href="#tag"/></svg><span class="t">Intern</span><small>11</small></div>
        <div class="row"><svg class="i tagi"><use href="#tag"/></svg><span class="t">Comercial</span><small>3</small></div>
      </section>
      <section class="group">
        <h3>Avui</h3>
        <div class="row sel"><span class="t">Revisió del llançament</span><small>42:10</small></div>
      </section>
      <section class="group">
        <h3>Aquesta setmana</h3>
        <div class="row"><span class="t">Seguiment pressupost Q4</span><small>28:45</small></div>
        <div class="row" data-other><span class="t">Retro de l'equip</span><small>51:02</small></div>
        <div class="row"><span class="t">Kickoff nova web</span><small>1:04:30</small></div>
      </section>
      <section class="group">
        <h3>Setembre</h3>
        <div class="row"><span class="t">Taller de requisits</span><small>1:31:12</small></div>
        <div class="row" data-other><span class="t">Entrevista candidata</span><small>38:20</small></div>
      </section>
    </div>
    <div class="foot"><span>Tot es queda en aquest Mac</span><svg class="i" style="width:16px;height:16px"><use href="#gear"/></svg></div>
  </nav>
  <main>
    <div class="toolbar"><div class="seg"><b class="on">Transcripció</b><b>Portada</b></div><span class="sp"></span></div>
    <article>
      <h1>Revisió del llançament</h1>
      <p class="meta">Dijous, 23 d'octubre de 2026 · 3 participants</p>
      <div class="chips" data-chips></div>
      <div class="utt">
        <div><span class="flag" style="color:var(--mm-speaker-1-text)">Marta</span><p>Llavors, si tanquem el disseny aquesta setmana, el dilluns ja podem començar amb les proves amb clients.</p></div>
        <div><span class="flag" style="color:var(--mm-speaker-2-text)">Jordi (Acme)</span><p>Per nosaltres perfecte. Només necessitaríem tenir els textos en anglès abans del dimecres.</p></div>
        <div><span class="flag" style="color:var(--mm-speaker-1-text)">Marta</span><p>D'acord, ho apunto com a tasca.</p></div>
      </div>
    </article>
  </main>
</div>
</template>

<div id="out"></div>

<script>
  const states = {
    // 1. Tags assigned; one came from the calendar
    a: { cap: "<b>1. Etiquetes d'una reunió.</b> Sota la data. «Acme» l'ha posat Murmur sola, perquè hi havia convidats de @acme.com (la icona de calendari ho diu; en passar-hi el ratolí: «Posada pels convidats de acme.com»). La creu surt en passar-hi el ratolí.",
      chips: `<span class="chip hover">Acme <svg class="i auto" style="width:12px;height:12px"><use href="#cal"/></svg><svg class="i x" style="width:12px;height:12px"><use href="#x"/></svg></span><span class="chip">Comercial</span><span class="chip add"><svg class="i" style="width:12px;height:12px"><use href="#plus"/></svg>Etiqueta</span>` },
    // 2. Adding a tag
    b: { cap: "<b>2. Afegir-ne una.</b> «+ Etiqueta» obre un buscador: escrius, tries amb les fletxes i Retorn, o en crees una de nova.",
      chips: `<span class="chip">Acme</span><span class="chip add on"><svg class="i" style="width:12px;height:12px"><use href="#plus"/></svg>Etiqueta</span>
        <div class="pop" style="left:62px">
          <div class="in"><svg class="i muted"><use href="#search"/></svg>fun<i></i></div>
          <div class="it f"><span class="c"></span>Fundació Bosch<small>5</small></div>
          <div class="it"><span class="c"><svg class="i"><use href="#plus"/></svg></span>Crea «fun»</div>
        </div>` },
    // 3. Filtering by a tag
    c: { cap: "<b>3. Filtrar.</b> Un clic a «Acme» deixa només les seves reunions; la cerca busca dins d'Acme. Clic dret a una etiqueta: reanomenar, ajuntar o esborrar.",
      filter: true, menu: true,
      chips: `<span class="chip">Acme</span><span class="chip">Comercial</span><span class="chip add"><svg class="i" style="width:12px;height:12px"><use href="#plus"/></svg>Etiqueta</span>` },
    // 4. Suggestion when there's no rule yet
    d: { cap: "<b>4. Suggeriment.</b> La primera vegada que surt un domini nou, Murmur no posa res sol: proposa l'etiqueta i, si l'acceptes, recorda «@acme.com és Acme» per a la propera.",
      chips: `<span class="chip">Comercial</span><span class="chip sugg"><svg class="i" style="width:12px;height:12px"><use href="#cal"/></svg>Afegeix <em>Acme</em>?</span><span class="chip add"><svg class="i" style="width:12px;height:12px"><use href="#plus"/></svg>Etiqueta</span>` },
  };
  const params = new URLSearchParams(location.search);
  const only = params.get("s");
  if (params.get("mode")) document.documentElement.dataset.mode = params.get("mode");
  for (const [k, s] of Object.entries(states)) {
    if (only && only !== k) continue;
    const cap = document.createElement("p"); cap.className = "cap"; cap.innerHTML = s.cap; out.append(cap);
    const w = win.content.cloneNode(true);
    w.querySelector("[data-chips]").innerHTML = s.chips;
    if (s.filter) {
      w.querySelector("[data-acme]").classList.add("sel");
      w.querySelectorAll("[data-other]").forEach((r) => r.remove());
      w.querySelector("[data-ph]").textContent = "Cerca a Acme";
      const sel = w.querySelector(".group .row.sel"); sel.classList.remove("sel"); sel.classList.add("sel");
    }
    if (s.menu) {
      const m = document.createElement("div"); m.className = "menu";
      m.innerHTML = `<div>Reanomena…</div><div class="f">Ajunta amb…</div><div>Domini: acme.com</div><hr><div class="d">Esborra l'etiqueta…</div>`;
      w.querySelector(".window").append(m);
    }
    out.append(w);
  }
</script>
</body>
</html>
